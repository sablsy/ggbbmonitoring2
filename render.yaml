# Render Blueprint — optional one-click deploy from the Render dashboard.
# After connecting this repo, set TELEGRAM_TOKEN and GROUP_CHAT_ID in the dashboard.

services:
  - type: worker
    name: grab-daily-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false
      - key: GROUP_CHAT_ID
        sync: false
      - key: PERPLEXITY_KEY
        sync: false
        optional: true
